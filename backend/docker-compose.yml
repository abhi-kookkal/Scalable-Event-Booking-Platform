version: "3.8"

services:
  db:
    image: postgres:15
    container_name: event_connect_db
    environment:
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: event_connect
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: event_connect_backend
    ports:
      - "8080:8080"
    environment:
      # IMPORTANT: JDBC URL (not postgresql://)
      DATABASE_URL: jdbc:postgresql://db:5432/event_connect
      DATABASE_USERNAME: event_user
      DATABASE_PASSWORD: password123
    depends_on:
      - db

volumes:
  postgres_data:
